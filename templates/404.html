{% extends 'base.html' %}

{% block title %}Page not found{% endblock %}

{% block content %}
    <div class="text-center py-5">
        <div class="display-1 fw-bold text-secondary">404</div>
        <h1 class="h3 fw-bold mt-3">This page doesn't exist</h1>
        <p class="text-secondary mb-4">
            The page you are looking for may have been removed, renamed or never existed.
        </p>
        <a href="{% url 'common:home' %}" class="btn btn-dark">
            <i class="bi bi-house-door me-1"></i>Back to dashboard
        </a>
    </div>
{% endblock %}
